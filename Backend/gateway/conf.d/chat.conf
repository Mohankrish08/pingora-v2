location /ws/ {
    # Docker's embedded DNS. Combined with a variable in proxy_pass this makes
    # resolution lazy, so the gateway still boots while the chat service does
    # not exist yet -- /ws/ simply returns 502 until it does.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $chat_upstream chat-service:8002;

    proxy_pass http://$chat_upstream;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    # Was $connectioin_upgrade -- a typo, which nginx treats as an empty
    # variable and silently drops the upgrade, so WebSockets never connected.
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSockets are long-lived; the default 60s read timeout would kill them.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
