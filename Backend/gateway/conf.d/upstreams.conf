# Upstream names must match the service names in docker-compose.yml, which is
# what Docker's embedded DNS resolves.

upstream authentication {
    server authentication:8000 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

upstream admin_service {
    server administration:8001 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

# NOTE: the chat service is not built yet. It is deliberately NOT declared as an
# upstream block here -- nginx resolves upstream hostnames at startup and
# refuses to boot if one does not exist, which would take the whole gateway
# down. chat.conf resolves it lazily instead.
