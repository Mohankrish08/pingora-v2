worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Do not advertise the nginx version to attackers.
    server_tokens off;

    # Cap request bodies: auth payloads are tiny, and an unbounded body is a
    # cheap way to exhaust upstream workers.
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time '
                    'upstream=$upstream_addr rid=$http_x_request_id';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Edge rate limiting, in front of the application-level limiter.
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;
    limit_req_status 429;

    include /etc/nginx/conf.d/upstreams.conf;
    include /etc/nginx/conf.d/websocket_upgrade.conf;

    server {
        listen 80;
        server_name localhost;

        include /etc/nginx/conf.d/auth.conf;
        include /etc/nginx/conf.d/admin.conf;
        include /etc/nginx/conf.d/chat.conf;

        location /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
