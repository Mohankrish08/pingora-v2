[project]
name = "common-helper"
version = "0.1.0"
description = "Shared configuration, security and middleware for Pingora services"
requires-python = ">=3.11"

# Declared so `pip install ./common-helpers` pulls its own dependencies rather
# than relying on each service's requirements.txt happening to list them.
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-jose[cryptography]>=3.4",
    "cryptography>=44.0",
    "argon2-cffi>=23.1",
    "redis[hiredis]>=5.2",
    "supabase>=2.11",
    "pyotp>=2.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Explicit package list. Auto-discovery previously missed sub-packages that had
# no __init__.py and silently shipped an incomplete distribution.
[tool.setuptools.packages.find]
include = ["common*"]

[tool.setuptools.package-data]
common = ["py.typed"]
